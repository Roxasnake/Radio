<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO B.A.T — Suno Player</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Parser ID3 léger pour lire l'image interne des MP3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0; background:#0b0d12; color:#ffffff; font-family:'Plus Jakarta Sans', sans-serif; overflow-x:hidden;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const ARTIST_NAME = "DJ B.A.T";
    const STATION_NAME = "RADIO B.A.T";
    const DEFAULT_COVER = "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop";
    const EPOCH = new Date("2026-01-01T00:00:00Z").getTime();

    // Extraction de la pochette ID3 du MP3 vers une URL Blob compatible Android
    function extractCoverFromMP3(url) {
      return new Promise((resolve) => {
        if (!window.jsmediatags) {
          resolve(null);
          return;
        }

        window.jsmediatags.read(url, {
          onSuccess: function(tag) {
            try {
              const picture = tag.tags && tag.tags.picture;
              if (picture && picture.data && picture.data.length > 0) {
                const byteArray = new Uint8Array(picture.data);
                const mimeType = picture.format || "image/jpeg";
                const blob = new Blob([byteArray], { type: mimeType });
                const blobUrl = URL.createObjectURL(blob);
                resolve(blobUrl);
              } else {
                resolve(null);
              }
            } catch (e) {
              resolve(null);
            }
          },
          onError: function() {
            resolve(null);
          }
        });
      });
    }

    function seededShuffle(array, seed = 42) {
      let m = array.length, t, i;
      let s = seed;
      const random = () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let imul = Math.imul(s ^ s >>> 15, 1 | s);
        imul = imul + Math.imul(imul ^ imul >>> 7, 61 | imul) ^ imul;
        return ((imul ^ imul >>> 14) >>> 0) / 4294967296;
      };
      const shuffled = [...array];
      while (m) {
        i = Math.floor(random() * m--);
        t = shuffled[m];
        shuffled[m] = shuffled[i];
        shuffled[i] = t;
      }
      return shuffled;
    }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) return "00:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m.toString().padStart(2, "0")}:${sec.toString().padStart(2, "0")}`;
    }

    function Radio() {
      const [tracks, setTracks] = useState([]);
      const [status, setStatus] = useState("idle");
      const [durations, setDurations] = useState(null);
      const [trackIndex, setTrackIndex] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentCover, setCurrentCover] = useState(DEFAULT_COVER);
      const audioRef = useRef(null);

      // Chargement des MP3
      useEffect(() => {
        let cancelled = false;
        setStatus("loading");

        Promise.all([
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/").then(r => r.json()).catch(() => []),
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/nouveautes").then(r => r.json()).catch(() => [])
        ])
          .then(([rootFiles, newFiles]) => {
            let allMP3s = [];

            const parseFiles = (files) => {
              if (!Array.isArray(files)) return [];
              return files
                .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".mp3"))
                .map(f => ({
                  title: decodeURIComponent(f.name.replace(/\.mp3$/i, "")),
                  url: f.download_url
                }));
            };

            allMP3s = [...parseFiles(rootFiles), ...parseFiles(newFiles)];
            if (allMP3s.length === 0) throw new Error("Aucun morceau MP3 trouvé");

            const shuffled = seededShuffle(allMP3s);
            setTracks(shuffled);

            return Promise.all(
              shuffled.map(
                (t) =>
                  new Promise((resolve) => {
                    const a = new Audio();
                    a.preload = "metadata";
                    a.src = t.url;
                    a.addEventListener("loadedmetadata", () => resolve(a.duration || 0));
                    a.addEventListener("error", () => resolve(0));
                  })
              )
            );
          })
          .then((durs) => {
            if (!cancelled && durs) {
              setDurations(durs);
              setStatus("idle");
            }
          })
          .catch(() => {
            if (!cancelled) setStatus("error");
          });

        return () => { cancelled = true; };
      }, []);

      // Extraction automatique de la pochette du MP3 actif
      useEffect(() => {
        let active = true;
        if (tracks.length > 0 && tracks[trackIndex]) {
          extractCoverFromMP3(tracks[trackIndex].url).then((blobUrl) => {
            if (active) {
              setCurrentCover(blobUrl || DEFAULT_COVER);
            }
          });
        }
        return () => { active = false; };
      }, [trackIndex, tracks]);

      const computePosition = useCallback(() => {
        if (!durations || durations.length === 0) return null;
        const total = durations.reduce((a, b) => a + b, 0);
        if (total <= 0) return null;

        const now = Date.now();
        let currentElapsed = ((now - EPOCH) / 1000) % total;
        if (currentElapsed < 0) currentElapsed += total;

        let idx = 0;
        for (let i = 0; i < durations.length; i++) {
          if (currentElapsed < durations[i]) {
            idx = i;
            break;
          }
          currentElapsed -= durations[i];
        }
        return { idx, offset: currentElapsed };
      }, [durations]);

      const tuneIn = useCallback(() => {
        const pos = computePosition();
        if (!pos || !audioRef.current || tracks.length === 0) return;

        setTrackIndex(pos.idx);
        const audio = audioRef.current;
        audio.src = tracks[pos.idx].url;
        audio.currentTime = pos.offset;

        audio
          .play()
          .then(() => {
            setStatus("live");
            setIsPlaying(true);
          })
          .catch(() => setStatus("error"));
      }, [computePosition, tracks]);

      const togglePlay = () => {
        const audio = audioRef.current;
        if (!audio) return;

        if (isPlaying) {
          audio.pause();
          setIsPlaying(false);
        } else {
          if (status !== "live") {
            tuneIn();
          } else {
            audio.play();
            setIsPlaying(true);
          }
        }
      };

      const handleNext = () => {
        const nextIdx = (trackIndex + 1) % tracks.length;
        setTrackIndex(nextIdx);
        if (audioRef.current) {
          audioRef.current.src = tracks[nextIdx].url;
          audioRef.current.play();
          setIsPlaying(true);
        }
      };

      const handlePrev = () => {
        const prevIdx = (trackIndex - 1 + tracks.length) % tracks.length;
        setTrackIndex(prevIdx);
        if (audioRef.current) {
          audioRef.current.src = tracks[prevIdx].url;
          audioRef.current.play();
          setIsPlaying(true);
        }
      };

      // Configuration de l'écran de verrouillage Android
      useEffect(() => {
        if ('mediaSession' in navigator && tracks.length > 0 && tracks[trackIndex]) {
          const currentTrack = tracks[trackIndex];

          navigator.mediaSession.metadata = new MediaMetadata({
            title: currentTrack.title,
            artist: ARTIST_NAME,
            album: STATION_NAME,
            artwork: [
              { src: currentCover, sizes: '512x512', type: 'image/jpeg' },
              { src: currentCover, sizes: '1024x1024', type: 'image/png' }
            ]
          });

          navigator.mediaSession.setActionHandler('play', () => {
            audioRef.current?.play();
            setIsPlaying(true);
          });
          navigator.mediaSession.setActionHandler('pause', () => {
            audioRef.current?.pause();
            setIsPlaying(false);
          });
          navigator.mediaSession.setActionHandler('previoustrack', handlePrev);
          navigator.mediaSession.setActionHandler('nexttrack', handleNext);
        }
      }, [trackIndex, tracks, currentCover]);

      useEffect(() => {
        const t = setInterval(() => {
          if (audioRef.current && !audioRef.current.paused) {
            setElapsed(audioRef.current.currentTime || 0);
          }
        }, 300);
        return () => clearInterval(t);
      }, []);

      const currentTrack = tracks[trackIndex] || { title: "Chargement..." };
      const currentDuration = durations ? durations[trackIndex] : 0;
      const progressPct = currentDuration ? Math.min(100, (elapsed / currentDuration) * 100) : 0;

      return (
        <div style={styles.appContainer}>
          <div 
            style={{
              ...styles.bgBlur,
              backgroundImage: `url(${currentCover})`
            }} 
          />

          <div style={styles.playerCard}>
            <div style={styles.topBar}>
              <span style={styles.stationBadge}>● DIRECT SYNCHRONE</span>
            </div>

            <div style={styles.coverWrapper}>
              <img 
                src={currentCover} 
                alt="Pochette" 
                style={styles.coverImage}
                onError={(e) => { e.target.src = DEFAULT_COVER; }}
              />
            </div>

            <div style={styles.trackInfo}>
              <h2 style={styles.trackTitle}>{currentTrack.title}</h2>
              <p style={styles.artistTitle}>{ARTIST_NAME}</p>
            </div>

            <div style={styles.controlsWidget}>
              <div style={styles.outputRow}>
                <div style={styles.outputDevice}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                  <span>Sortie média</span>
                </div>
              </div>

              <div style={styles.progressContainer}>
                <div style={styles.progressBarBg}>
                  <div style={{ ...styles.progressBarFill, width: `${progressPct}%` }} />
                  <div style={{ ...styles.progressKnob, left: `calc(${progressPct}% - 6px)` }} />
                </div>
                <div style={styles.timeRow}>
                  <span>{formatTime(elapsed)}</span>
                  <span>{formatTime(currentDuration)}</span>
                </div>
              </div>

              <div style={styles.buttonsRow}>
                <button style={styles.iconBtn} onClick={handlePrev}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button style={styles.playBtn} onClick={isPlaying ? togglePlay : tuneIn}>
                  {isPlaying ? (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                  ) : (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: '3px' }}><path d="M8 5v14l11-7z"/></svg>
                  )}
                </button>

                <button style={styles.iconBtn} onClick={handleNext}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
              </div>
            </div>
          </div>

          <audio ref={audioRef} onEnded={handleNext} />
        </div>
      );
    }

    const styles = {
      appContainer: {
        position: 'relative',
        minHeight: '100vh',
        width: '100vw',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        padding: '20px',
        boxSizing: 'border-box',
        overflow: 'hidden'
      },
      bgBlur: {
        position: 'absolute',
        top: '-10%',
        left: '-10%',
        width: '120%',
        height: '120%',
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        filter: 'blur(50px) brightness(0.4)',
        transform: 'scale(1.1)',
        zIndex: 0,
        transition: 'background-image 0.8s ease-in-out'
      },
      playerCard: {
        position: 'relative',
        zIndex: 1,
        width: '100%',
        maxWidth: '380px',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center'
      },
      topBar: {
        marginBottom: '16px'
      },
      stationBadge: {
        fontSize: '11px',
        fontWeight: '700',
        letterSpacing: '1.5px',
        color: '#55d6be',
        background: 'rgba(85, 214, 190, 0.15)',
        padding: '6px 14px',
        borderRadius: '20px',
        border: '1px solid rgba(85, 214, 190, 0.3)'
      },
      coverWrapper: {
        width: '100%',
        aspectRatio: '1 / 1',
        borderRadius: '28px',
        overflow: 'hidden',
        boxShadow: '0 20px 40px rgba(0,0,0,0.6)',
        marginBottom: '20px'
      },
      coverImage: {
        width: '100%',
        height: '100%',
        objectFit: 'cover'
      },
      trackInfo: {
        textAlign: 'center',
        marginBottom: '22px',
        width: '100%'
      },
      trackTitle: {
        fontSize: '22px',
        fontWeight: '800',
        margin: '0 0 6px 0',
        color: '#ffffff',
        letterSpacing: '-0.3px',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
        textOverflow: 'ellipsis'
      },
      artistTitle: {
        fontSize: '14px',
        fontWeight: '600',
        margin: 0,
        color: 'rgba(255, 255, 255, 0.65)'
      },
      controlsWidget: {
        width: '100%',
        background: 'rgba(30, 42, 50, 0.65)',
        backdropFilter: 'blur(25px)',
        WebkitBackdropFilter: 'blur(25px)',
        borderRadius: '24px',
        padding: '18px',
        boxSizing: 'border-box',
        border: '1px solid rgba(255, 255, 255, 0.12)',
        boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
      },
      outputRow: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginBottom: '14px'
      },
      outputDevice: {
        display: 'flex',
        alignItems: 'center',
        gap: '6px',
        fontSize: '12px',
        color: 'rgba(255, 255, 255, 0.7)',
        fontWeight: '600'
      },
      progressContainer: {
        width: '100%',
        marginBottom: '16px'
      },
      progressBarBg: {
        position: 'relative',
        width: '100%',
        height: '4px',
        background: 'rgba(255, 255, 255, 0.2)',
        borderRadius: '2px',
        marginBottom: '8px'
      },
      progressBarFill: {
        height: '100%',
        background: '#55d6be',
        borderRadius: '2px',
        transition: 'width 0.3s linear'
      },
      progressKnob: {
        position: 'absolute',
        top: '-4px',
        width: '12px',
        height: '12px',
        borderRadius: '50%',
        background: '#55d6be',
        boxShadow: '0 0 8px #55d6be'
      },
      timeRow: {
        display: 'flex',
        justifyContent: 'space-between',
        fontSize: '11px',
        color: 'rgba(255, 255, 255, 0.5)',
        fontWeight: '600'
      },
      buttonsRow: {
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: '28px'
      },
      iconBtn: {
        background: 'none',
        border: 'none',
        color: '#ffffff',
        cursor: 'pointer',
        padding: '8px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        opacity: 0.85
      },
      playBtn: {
        width: '52px',
        height: '52px',
        borderRadius: '50%',
        background: '#ffffff',
        color: '#0b0d12',
        border: 'none',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        cursor: 'pointer',
        boxShadow: '0 4px 15px rgba(255,255,255,0.2)'
      }
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Radio />);
  </script>
</body>
</html>
