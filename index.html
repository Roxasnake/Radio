<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO B.A.T</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0; background:#050302;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const STATION_NAME = "RADIO B.A.T";
    const EPOCH = new Date("2026-01-01T00:00:00Z").getTime();
    
    // Intervalle entre interventions du DJ (30 minutes par défaut)
    // 💡 Astuce : change temporairement par (10 * 1000) pour tester toutes les 10 secondes !
    const ANNOUNCE_INTERVAL_MS = 30 * 60 * 1000;

    // Mélange pseudo-aléatoire déterministe (mélange identique pour tous les auditeurs)
    function seededShuffle(array, seed = 42) {
      let m = array.length, t, i;
      let s = seed;
      const random = () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let imul = Math.imul(s ^ s >>> 15, 1 | s);
        imul = imul + Math.imul(imul ^ imul >>> 7, 61 | imul) ^ imul;
        return ((imul ^ imul >>> 14) >>> 0) / 4294967296;
      };
      const shuffled = [...array];
      while (m) {
        i = Math.floor(random() * m--);
        t = shuffled[m];
        shuffled[m] = shuffled[i];
        shuffled[i] = t;
      }
      return shuffled;
    }

    function announceUpcoming(titles, onDone) {
      if (!titles || titles.length === 0) {
        if (onDone) onDone();
        return;
      }

      // Nettoie les titres pour supprimer le surplus entre parenthèses
      const cleanTitles = titles.map(t => t.replace(/\(.*\)/g, '').trim());
      const list = cleanTitles.join(", puis ");

      const fallbackText = `Vous écoutez Radio B.A.T. À suivre sur notre antenne : ${list}. Restez à l'écoute !`;
      const promptText = `Tu es un animateur radio nocturne, calme et posé. En une seule phrase très courte (15 mots max), annonce qu'on va écouter : ${list}. Ne mets pas de guillemets.`;

      const speak = (textToSpeak) => {
        if (!('speechSynthesis' in window)) {
          if (onDone) onDone();
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSpeak);
        utter.lang = "fr-FR";
        utter.rate = 0.93; // Débit de voix posé style radio
        utter.onend = () => { if (onDone) onDone(); };
        utter.onerror = () => { if (onDone) onDone(); };
        window.speechSynthesis.speak(utter);
      };

      // Requête POST vers l'IA pour gérer proprement tous les noms de fichiers
      fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            { role: "user", content: promptText }
          ],
          seed: Math.floor(Math.random() * 1000)
        })
      })
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.text();
        })
        .then((text) => {
          if (!text || text.includes("<!DOCTYPE") || text.length > 250) {
            speak(fallbackText);
          } else {
            speak(text.trim());
          }
        })
        .catch(() => {
          // En cas d'erreur API, le DJ prend le texte de secours
          speak(fallbackText);
        });
    }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) s = 0;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, "0")}`;
    }

    function Radio() {
      const [tracks, setTracks] = useState([]);
      const [status, setStatus] = useState("idle");
      const [durations, setDurations] = useState(null);
      const [trackIndex, setTrackIndex] = useState(0);
      const [elapsedInTrack, setElapsedInTrack] = useState(0);
      const audioRef = useRef(null);

      const trackIndexRef = useRef(0);
      const tracksRef = useRef([]);
      const lastAnnouncementRef = useRef(Date.now());

      useEffect(() => { trackIndexRef.current = trackIndex; }, [trackIndex]);
      useEffect(() => { tracksRef.current = tracks; }, [tracks]);

      // Scan dynamique du dépôt GitHub + Mélange
      useEffect(() => {
        let cancelled = false;
        setStatus("loading");

        fetch("https://api.github.com/repos/Roxasnake/Radio/contents/")
          .then((res) => res.json())
          .then((files) => {
            if (!Array.isArray(files)) throw new Error("API GitHub indisponible");

            const rawTracks = files
              .filter((f) => f.type === "file" && f.name.toLowerCase().endsWith(".mp3") && !f.name.startsWith("dj_"))
              .map((f) => ({
                title: decodeURIComponent(f.name.replace(/\.mp3$/i, "")),
                url: f.download_url,
              }));

            if (rawTracks.length === 0) throw new Error("Aucun MP3 trouvé");

            const shuffled = seededShuffle(rawTracks);
            setTracks(shuffled);

            return Promise.all(
              shuffled.map(
                (t) =>
                  new Promise((resolve) => {
                    const a = new Audio();
                    a.preload = "metadata";
                    a.src = t.url;
                    a.addEventListener("loadedmetadata", () => resolve(a.duration || 0));
                    a.addEventListener("error", () => resolve(0));
                  })
              )
            );
          })
          .then((durs) => {
            if (!cancelled && durs) {
              setDurations(durs);
              setStatus((s) => (s === "loading" ? "idle" : s));
            }
          })
          .catch(() => {
            if (!cancelled) setStatus("error");
          });

        return () => { cancelled = true; };
      }, []);

      const computePosition = useCallback(() => {
        if (!durations || durations.length === 0) return null;
        const total = durations.reduce((a, b) => a + b, 0);
        if (total <= 0) return null;

        const now = Date.now();
        let elapsed = ((now - EPOCH) / 1000) % total;
        if (elapsed < 0) elapsed += total;

        let idx = 0;
        for (let i = 0; i < durations.length; i++) {
          if (elapsed < durations[i]) {
            idx = i;
            break;
          }
          elapsed -= durations[i];
        }
        return { idx, offset: elapsed };
      }, [durations]);

      const tuneIn = useCallback(() => {
        const pos = computePosition();
        if (!pos || !audioRef.current || tracks.length === 0) return;

        setTrackIndex(pos.idx);
        const audio = audioRef.current;
        audio.src = tracks[pos.idx].url;
        audio.currentTime = pos.offset;

        audio
          .play()
          .then(() => setStatus("live"))
          .catch(() => setStatus("error"));
      }, [computePosition, tracks]);

      const handleEnded = () => { tuneIn(); };

      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === "visible" && status === "live") {
            tuneIn();
          }
        };
        document.addEventListener("visibilitychange", handleVisibilityChange);
        return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
      }, [status, tuneIn]);

      // Timer de progression et déclenchement DJ
      useEffect(() => {
        const t = setInterval(() => {
          const audio = audioRef.current;
          if (audio && !audio.paused) {
            setElapsedInTrack(audio.currentTime || 0);

            const remaining = (audio.duration || 0) - audio.currentTime;
            const now = Date.now();

            if (
              remaining > 0 &&
              remaining <= 12 &&
              now - lastAnnouncementRef.current >= ANNOUNCE_INTERVAL_MS &&
              tracksRef.current.length > 0
            ) {
              lastAnnouncementRef.current = now;
              const upcoming = [1, 2].map(
                (offset) => tracksRef.current[(trackIndexRef.current + offset) % tracksRef.current.length].title
              );

              // Ducking : baisse le volume de la musique pendant le parler du DJ
              audio.volume = 0.15;
              announceUpcoming(upcoming, () => {
                if (audioRef.current) audioRef.current.volume = 1.0;
              });
            }
          }
        }, 400);
        return () => clearInterval(t);
      }, []);

      const currentDuration = durations ? durations[trackIndex] : 0;
      const progressPct = currentDuration
        ? Math.min(100, (elapsedInTrack / currentDuration) * 100)
        : 0;

      return (
        <div style={styles.wrap}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');
            @keyframes eqbar { 0%, 100% { transform: scaleY(0.2); } 50% { transform: scaleY(1); } }
            @keyframes ledpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
            .rb-bar { animation: eqbar 0.8s ease-in-out infinite; transform-origin: bottom; }
            .rb-led-live { animation: ledpulse 1.8s ease-in-out infinite; }
          `}</style>

          <div style={styles.panel}>
            <div style={styles.headerRow}>
              <div
                className={status === "live" ? "rb-led-live" : ""}
                style={{
                  ...styles.led,
                  background: status === "live" ? "#ff5a3c" : "#3a2a22",
                  boxShadow: status === "live" ? "0 0 10px #ff5a3c" : "none",
                }}
              />
              <span style={styles.headerLabel}>
                {status === "live"
                  ? "ON AIR"
                  : status === "loading"
                  ? "SCAN DU DOSSIER MP3…"
                  : status === "error"
                  ? "ERREUR DE FLUX"
                  : "STANDBY"}
              </span>
            </div>

            <h1 style={styles.station}>{STATION_NAME}</h1>
            <div style={styles.freq}>98.7 FM · Direct Synchrone Auto</div>

            <div style={styles.dial}>
              {Array.from({ length: 21 }).map((_, i) => (
                <div key={i} style={{ ...styles.tick, height: i % 5 === 0 ? "10px" : "5px", opacity: i === 10 ? 1 : 0.35 }} />
              ))}
              <div style={styles.needle} />
            </div>

            <div style={styles.display}>
              <div style={styles.trackLabel}>
                {tracks.length > 0 ? tracks[trackIndex]?.title : "Détection des morceaux..."}
              </div>
              <div style={styles.timeRow}>
                <span>{formatTime(elapsedInTrack)}</span>
                <span>{formatTime(currentDuration)}</span>
              </div>
              <div style={styles.progressTrack}>
                <div style={{ ...styles.progressFill, width: `${progressPct}%` }} />
              </div>
            </div>

            <div style={styles.bars}>
              {Array.from({ length: 14 }).map((_, i) => (
                <div
                  key={i}
                  className={status === "live" ? "rb-bar" : ""}
                  style={{
                    ...styles.bar,
                    animationDelay: `${(i % 5) * 0.12}s`,
                    transform: status === "live" ? undefined : "scaleY(0.15)",
                  }}
                />
              ))}
            </div>

            {status !== "live" && (
              <button style={styles.tuneButton} onClick={tuneIn} disabled={!durations}>
                {durations ? "Se brancher sur l'antenne" : "Chargement des fréquences…"}
              </button>
            )}

            {status === "live" && <div style={styles.liveNote}>Flux en direct · Animateur nocturne actif</div>}
            {status === "error" && (
              <div style={styles.liveNote}>Erreur au chargement des MP3. Vérifie le dépôt.</div>
            )}

            <audio ref={audioRef} onEnded={handleEnded} />
          </div>
        </div>
      );
    }

    const styles = {
      wrap: { minHeight: "100vh", width: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "radial-gradient(circle at 30% 15%, #241a10 0%, #0c0805 60%, #050302 100%)", padding: "20px", boxSizing: "border-box" },
      panel: { width: "100%", maxWidth: "380px", background: "linear-gradient(160deg, #3c2a1c 0%, #24160b 100%)", border: "1px solid #6b4d2a", borderRadius: "18px", padding: "22px 20px 26px", boxShadow: "0 20px 45px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06)", fontFamily: "'Space Mono', 'Courier New', monospace", color: "#f0dcb8" },
      headerRow: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px" },
      led: { width: "9px", height: "9px", borderRadius: "50%", flexShrink: 0, transition: "all 0.3s ease" },
      headerLabel: { fontSize: "11px", letterSpacing: "2px", color: "#c9a877" },
      station: { fontFamily: "'Bebas Neue', sans-serif", fontSize: "38px", letterSpacing: "3px", color: "#f2b544", margin: "2px 0 0", lineHeight: 1 },
      freq: { fontSize: "11px", color: "#a48760", marginTop: "4px", marginBottom: "16px", letterSpacing: "1px" },
      dial: { position: "relative", display: "flex", alignItems: "flex-end", justifyContent: "space-between", height: "14px", marginBottom: "18px", padding: "0 2px" },
      tick: { width: "2px", background: "#c9a877", borderRadius: "1px" },
      needle: { position: "absolute", left: "50%", bottom: "-4px", width: "0", height: "0", borderLeft: "5px solid transparent", borderRight: "5px solid transparent", borderBottom: "7px solid #ff5a3c", transform: "translateX(-50%)" },
      display: { background: "#120d08", border: "1px solid #4a3620", borderRadius: "10px", padding: "14px 14px 12px", marginBottom: "16px" },
      trackLabel: { fontSize: "13px", color: "#ffbb33", minHeight: "34px", lineHeight: 1.3, marginBottom: "8px" },
      timeRow: { display: "flex", justifyContent: "space-between", fontSize: "11px", color: "#8a6d47", marginBottom: "6px" },
      progressTrack: { height: "4px", borderRadius: "2px", background: "#2a1e12", overflow: "hidden" },
      progressFill: { height: "100%", background: "linear-gradient(90deg, #ffbb33, #ff5a3c)", transition: "width 0.4s linear" },
      bars: { display: "flex", alignItems: "flex-end", gap: "4px", height: "36px", marginBottom: "20px", justifyContent: "center" },
      bar: { width: "5px", height: "100%", borderRadius: "2px", background: "linear-gradient(180deg, #ffbb33, #ff5a3c)" },
      tuneButton: { width: "100%", padding: "13px", borderRadius: "10px", border: "none", background: "linear-gradient(160deg, #f2b544, #d9862a)", color: "#241608", fontFamily: "'Space Mono', monospace", fontWeight: "bold", fontSize: "13px", letterSpacing: "0.5px", cursor: "pointer" },
      liveNote: { textAlign: "center", fontSize: "10.5px", color="#8a6d47", letterSpacing: "0.5px" }
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Radio />);
  </script>
</body>
</html>
