<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO B.A.T — Direct</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0d12'/><path d='M38 30v40l32-20z' fill='%2355d6be'/></svg>" />
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    input[type=range].volume-slider {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range].volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; height: 12px; width: 12px;
      border-radius: 50%; background: #55d6be; box-shadow: 0 0 8px #55d6be; cursor: pointer;
    }
    input[type=range].volume-slider::-moz-range-thumb {
      height: 12px; width: 12px; border-radius: 50%;
      background: #55d6be; border: none; box-shadow: 0 0 8px #55d6be; cursor: pointer;
    }
    /* Scrollbar pour les paroles */
    .lyrics-scroll::-webkit-scrollbar { width: 4px; }
    .lyrics-scroll::-webkit-scrollbar-track { background: transparent; }
    .lyrics-scroll::-webkit-scrollbar-thumb { background: rgba(85, 214, 190, 0.5); border-radius: 4px; }
  </style>
</head>
<body style="margin:0; background:#0b0d12; color:#ffffff; font-family:'Plus Jakarta Sans', sans-serif; overflow-x:hidden;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const ARTIST_NAME = "DJ B.A.T";
    const STATION_NAME = "RADIO B.A.T";
    const EPOCH = new Date("2026-01-01T00:00:00Z").getTime();
    const DEFAULT_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'><rect width='100%' height='100%' fill='%23121824'/><circle cx='300' cy='300' r='200' fill='none' stroke='%2355d6be' stroke-width='4' opacity='0.25'/><circle cx='300' cy='300' r='140' fill='none' stroke='%2355d6be' stroke-width='2' opacity='0.15'/><text x='50%25' y='46%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-size='42' font-weight='800' letter-spacing='4'>RADIO B.A.T</text><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='%2355d6be' font-family='sans-serif' font-size='18' font-weight='700' letter-spacing='6'>DIRECT SYNCHRONE</text></svg>";

    async function extractCoverFromMP3(url) {
      if (!window.jsmediatags) return null;
      try {
        const response = await fetch(url);
        if (!response.ok) return null;
        const blob = await response.blob();
        return new Promise((resolve) => {
          window.jsmediatags.read(blob, {
            onSuccess: function(tag) {
              try {
                const picture = tag.tags && tag.tags.picture;
                if (picture && picture.data && picture.data.length > 0) {
                  const byteArray = new Uint8Array(picture.data);
                  const mimeType = picture.format || "image/jpeg";
                  const imageBlob = new Blob([byteArray], { type: mimeType });
                  resolve(URL.createObjectURL(imageBlob));
                } else { resolve(null); }
              } catch (e) { resolve(null); }
            },
            onError: function() { resolve(null); }
          });
        });
      } catch (e) { return null; }
    }

    function seededShuffle(array, seed = 42) {
      let m = array.length, t, i; let s = seed;
      const random = () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let imul = Math.imul(s ^ s >>> 15, 1 | s);
        imul = imul + Math.imul(imul ^ imul >>> 7, 61 | imul) ^ imul;
        return ((imul ^ imul >>> 14) >>> 0) / 4294967296;
      };
      const shuffled = [...array];
      while (m) {
        i = Math.floor(random() * m--);
        t = shuffled[m]; shuffled[m] = shuffled[i]; shuffled[i] = t;
      }
      return shuffled;
    }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) return "00:00";
      const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
      return `${m.toString().padStart(2, "0")}:${sec.toString().padStart(2, "0")}`;
    }

    function Radio() {
      const [tracks, setTracks] = useState([]);
      const [status, setStatus] = useState("idle");
      const [durations, setDurations] = useState(null);
      const [trackIndex, setTrackIndex] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentCover, setCurrentCover] = useState(DEFAULT_COVER);
      const [volume, setVolume] = useState(0.8);
      const [prevVolume, setPrevVolume] = useState(0.8);
      
      const [lyrics, setLyrics] = useState(null);
      const [showLyrics, setShowLyrics] = useState(false);
      
      const audioRef = useRef(null);
      const coverCacheRef = useRef({});

      const handleVolumeChange = (e) => {
        const val = parseFloat(e.target.value);
        setVolume(val);
        if (audioRef.current) audioRef.current.volume = val;
      };

      const toggleMute = () => {
        if (volume > 0) {
          setPrevVolume(volume); setVolume(0);
          if (audioRef.current) audioRef.current.volume = 0;
        } else {
          const restoreVol = prevVolume > 0 ? prevVolume : 0.8;
          setVolume(restoreVol);
          if (audioRef.current) audioRef.current.volume = restoreVol;
        }
      };

      useEffect(() => {
        let cancelled = false; setStatus("loading");

        Promise.all([
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/").then(r => r.json()).catch(() => []),
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/nouveautes").then(r => r.json()).catch(() => [])
        ])
          .then(([rootFiles, newFiles]) => {
            const parseFiles = (files) => {
              if (!Array.isArray(files)) return [];
              return files
                .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".mp3"))
                .map(f => ({
                  title: decodeURIComponent(f.name.replace(/\.mp3$/i, "")),
                  url: f.download_url
                }));
            };
            const allMP3s = [...parseFiles(rootFiles), ...parseFiles(newFiles)];
            if (allMP3s.length === 0) throw new Error("Aucun morceau MP3 trouvé");

            const shuffled = seededShuffle(allMP3s);
            setTracks(shuffled);

            return Promise.all(
              shuffled.map(t => new Promise(resolve => {
                const a = new Audio(); a.preload = "metadata"; a.src = t.url;
                a.addEventListener("loadedmetadata", () => resolve(a.duration || 0));
                a.addEventListener("error", () => resolve(0));
              }))
            );
          })
          .then(durs => {
            if (!cancelled && durs) { setDurations(durs); setStatus("idle"); }
          })
          .catch(() => { if (!cancelled) setStatus("error"); });

        return () => { cancelled = true; };
      }, []);

      const computePosition = useCallback(() => {
        if (!durations || durations.length === 0) return null;
        const total = durations.reduce((a, b) => a + b, 0);
        if (total <= 0) return null;
        const now = Date.now();
        let currentElapsed = ((now - EPOCH) / 1000) % total;
        if (currentElapsed < 0) currentElapsed += total;

        let idx = 0;
        for (let i = 0; i < durations.length; i++) {
          if (currentElapsed < durations[i]) { idx = i; break; }
          currentElapsed -= durations[i];
        }
        return { idx, offset: currentElapsed };
      }, [durations]);

      const tuneIn = useCallback(() => {
        const pos = computePosition();
        if (!pos || !audioRef.current || tracks.length === 0) return;
        setTrackIndex(pos.idx);
        const audio = audioRef.current;
        audio.src = tracks[pos.idx].url; audio.currentTime = pos.offset; audio.volume = volume;
        audio.play().then(() => { setStatus("live"); setIsPlaying(true); }).catch(() => setStatus("error"));
      }, [computePosition, tracks, volume]);

      useEffect(() => {
        let active = true;
        if (tracks.length > 0 && tracks[trackIndex]) {
          const track = tracks[trackIndex];
          
          if (coverCacheRef.current[track.url]) {
            setCurrentCover(coverCacheRef.current[track.url]);
          } else {
            (async () => {
              const extractedImg = await extractCoverFromMP3(track.url);
              const finalCover = extractedImg || DEFAULT_COVER;
              coverCacheRef.current[track.url] = finalCover;
              if (active) setCurrentCover(finalCover);
            })();
          }

          const lyricsUrl = track.url.replace(/\.mp3$/i, '.txt');
          setLyrics(null);
          setShowLyrics(false);
          
          fetch(lyricsUrl)
            .then(res => {
              if (res.ok) return res.text();
              throw new Error("Pas de paroles");
            })
            .then(text => {
              if (active) setLyrics(text);
            })
            .catch(() => {
              if (active) setLyrics(null);
            });
        }
        return () => { active = false; };
      }, [trackIndex, tracks]);

      const togglePlay = () => {
        const audio = audioRef.current;
        if (!audio) return;
        if (isPlaying) { audio.pause(); setIsPlaying(false); } 
        else { status !== "live" ? tuneIn() : (audio.play(), setIsPlaying(true)); }
      };

      useEffect(() => {
        const t = setInterval(() => {
          if (audioRef.current && !audioRef.current.paused) {
            setElapsed(audioRef.current.currentTime || 0);
          }
        }, 300);
        return () => clearInterval(t);
      }, []);

      const currentTrack = tracks[trackIndex] || { title: "Connexion au flux..." };
      const currentDuration = durations ? durations[trackIndex] : 0;
      const progressPct = currentDuration ? Math.min(100, (elapsed / currentDuration) * 100) : 0;

      return (
        <div style={styles.appContainer}>
          <div style={{ ...styles.bgBlur, backgroundImage: `url(${currentCover})` }} />

          <div style={styles.contentWrapper}>
            <div style={styles.playerCard}>
              <div style={styles.topBar}>
                <span style={styles.stationBadge}>● DIRECT SYNCHRONE</span>
              </div>

              <div style={styles.coverWrapper}>
                <img 
                  src={currentCover} 
                  alt="Pochette" 
                  style={{...styles.coverImage, opacity: showLyrics ? 0.3 : 1}}
                  onError={(e) => { e.target.src = DEFAULT_COVER; }}
                />
                
                {showLyrics && (
                  <div style={styles.lyricsOverlay} className="lyrics-scroll">
                    {lyrics}
                  </div>
                )}
              </div>

              <div style={styles.trackInfo}>
                <h2 style={styles.trackTitle}>{currentTrack.title}</h2>
                <p style={styles.artistTitle}>{ARTIST_NAME}</p>
                
                {lyrics && (
                  <button 
                    style={styles.lyricsBtn} 
                    onClick={() => setShowLyrics(!showLyrics)}
                  >
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{marginRight: '6px'}}>
                      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    {showLyrics ? "Masquer les paroles" : "Lire les paroles"}
                  </button>
                )}
              </div>

              <div style={styles.controlsWidget}>
                <div style={styles.progressContainer}>
                  <div style={styles.progressBarBg}>
                    <div style={{ ...styles.progressBarFill, width: `${progressPct}%` }} />
                    <div style={{ ...styles.progressKnob, left: `calc(${progressPct}% - 6px)` }} />
                  </div>
                  <div style={styles.timeRow}>
                    <span>{formatTime(elapsed)}</span>
                    <span>{formatTime(currentDuration)}</span>
                  </div>
                </div>

                <div style={styles.buttonsRow}>
                  <button style={styles.playBtn} onClick={isPlaying ? togglePlay : tuneIn}>
                    {isPlaying ? (
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style={{ display: 'block' }}>
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                      </svg>
                    ) : (
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style={{ display: 'block', marginLeft: '4px' }}>
                        <path d="M8 5v14l11-7z"/>
                      </svg>
                    )}
                  </button>
                </div>

                <div style={styles.volumeContainer}>
                  <button style={styles.volumeBtn} onClick={toggleMute} title="Muet / Réactiver">
                    {volume === 0 ? (
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v6a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/></svg>
                    ) : volume < 0.5 ? (
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    ) : (
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    )}
                  </button>
                  <input type="range" min="0" max="1" step="0.01" value={volume} onChange={handleVolumeChange} className="volume-slider"/>
                </div>
              </div>
            </div>
            
            {/* WIDGET DE CHAT DISCORD */}
            <div style={styles.chatContainer}>
              <iframe 
                src="https://e.widgetbot.io/channels/1281338141671952505/1542861622614171809" 
                width="100%" 
                height="100%" 
                allowTransparency="true" 
                frameBorder="0" 
                title="Chat RADIO B.A.T">
              </iframe>
            </div>

          </div>
          <audio ref={audioRef} onEnded={tuneIn} />
        </div>
      );
    }

    const styles = {
      appContainer: {
        position: 'relative', minHeight: '100vh', width: '100vw',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: '20px', overflow: 'hidden'
      },
      bgBlur: {
        position: 'absolute', top: '-10%', left: '-10%', width: '120%', height: '120%',
        backgroundSize: 'cover', backgroundPosition: 'center',
        filter: 'blur(55px) brightness(0.35)', transform: 'scale(1.1)', zIndex: 0, transition: 'background-image 0.8s'
      },
      contentWrapper: {
        position: 'relative', zIndex: 1, display: 'flex', flexDirection: 'row', 
        gap: '30px', alignItems: 'flex-start', flexWrap: 'wrap', justifyContent: 'center',
        width: '100%', maxWidth: '800px'
      },
      playerCard: {
        width: '100%', maxWidth: '380px', display: 'flex', flexDirection: 'column', alignItems: 'center'
      },
      chatContainer: {
        width: '100%', maxWidth: '350px', height: '620px', background: 'rgba(30, 42, 50, 0.65)',
        backdropFilter: 'blur(25px)', borderRadius: '24px', overflow: 'hidden',
        border: '1px solid rgba(255, 255, 255, 0.12)', boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
      },
      topBar: { marginBottom: '16px' },
      stationBadge: {
        fontSize: '11px', fontWeight: '700', letterSpacing: '1.5px', color: '#55d6be',
        background: 'rgba(85, 214, 190, 0.15)', padding: '6px 14px', borderRadius: '20px', border: '1px solid rgba(85, 214, 190, 0.3)'
      },
      coverWrapper: {
        position: 'relative', width: '100%', aspectRatio: '1 / 1', borderRadius: '28px',
        overflow: 'hidden', boxShadow: '0 20px 40px rgba(0,0,0,0.6)', marginBottom: '14px',
        background: '#0b0d12'
      },
      coverImage: { width: '100%', height: '100%', objectFit: 'cover', transition: 'opacity 0.3s ease' },
      lyricsOverlay: {
        position: 'absolute', top: 0, left: 0, width: '100%', height: '100%',
        padding: '20px', color: '#fff', fontSize: '15px', lineHeight: '1.6',
        fontWeight: '600', textAlign: 'center', overflowY: 'auto', whiteSpace: 'pre-wrap',
        display: 'flex', flexDirection: 'column'
      },
      trackInfo: { textAlign: 'center', marginBottom: '18px', width: '100%' },
      trackTitle: {
        fontSize: '22px', fontWeight: '800', margin: '0 0 4px 0', color: '#ffffff',
        letterSpacing: '-0.3px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'
      },
      artistTitle: { fontSize: '14px', fontWeight: '600', margin: '0 0 10px 0', color: 'rgba(255, 255, 255, 0.65)' },
      lyricsBtn: {
        background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)',
        color: '#fff', borderRadius: '12px', padding: '6px 12px', fontSize: '12px',
        fontWeight: '700', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', transition: 'background 0.2s'
      },
      controlsWidget: {
        width: '100%', background: 'rgba(30, 42, 50, 0.65)', backdropFilter: 'blur(25px)',
        borderRadius: '24px', padding: '18px', border: '1px solid rgba(255, 255, 255, 0.12)',
        boxShadow: '0 10px 30px rgba(0,0,0,0.3)', display: 'flex', flexDirection: 'column', alignItems: 'center'
      },
      progressContainer: { width: '100%', marginBottom: '16px' },
      progressBarBg: { position: 'relative', width: '100%', height: '4px', background: 'rgba(255, 255, 255, 0.2)', borderRadius: '2px', marginBottom: '8px' },
      progressBarFill: { height: '100%', background: '#55d6be', borderRadius: '2px', transition: 'width 0.3s linear' },
      progressKnob: { position: 'absolute', top: '-4px', width: '12px', height: '12px', borderRadius: '50%', background: '#55d6be', boxShadow: '0 0 8px #55d6be' },
      timeRow: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '11px', color: 'rgba(255, 255, 255, 0.5)', fontWeight: '600', width: '100%' },
      buttonsRow: { display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', marginBottom: '16px' },
      playBtn: { width: '56px', height: '56px', borderRadius: '50%', background: '#ffffff', color: '#0b0d12', border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 4px 15px rgba(255,255,255,0.25)', padding: 0, outline: 'none' },
      volumeContainer: { display: 'flex', alignItems: 'center', gap: '10px', width: '100%', padding: '0 4px' },
      volumeBtn: { background: 'none', border: 'none', color: 'rgba(255, 255, 255, 0.7)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0 }
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Radio />);
  </script>
</body>
</html>
