<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO B.A.T</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lecture des tags ID3 (APIC) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body style="margin:0; background:#050302; overflow-x:hidden;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const STATION_NAME = "RADIO B.A.T";
    const EPOCH = new Date("2026-01-01T00:00:00Z").getTime();
    const ANNOUNCE_INTERVAL_MS = 30 * 60 * 1000;

    function seededShuffle(array, seed = 42) {
      let m = array.length, t, i;
      let s = seed;
      const random = () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let imul = Math.imul(s ^ s >>> 15, 1 | s);
        imul = imul + Math.imul(imul ^ imul >>> 7, 61 | imul) ^ imul;
        return ((imul ^ imul >>> 14) >>> 0) / 4294967296;
      };
      const shuffled = [...array];
      while (m) {
        i = Math.floor(random() * m--);
        t = shuffled[m];
        shuffled[m] = shuffled[i];
        shuffled[i] = t;
      }
      return shuffled;
    }

    function getTimeContext() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();

      if (h === 9 && m >= 20 && m <= 40) return "C'est l'heure de la pause café !";
      if (h === 12 && m <= 20) return "C'est l'heure du repas, bon appétit à tous.";
      if (h === 16 && m <= 30) return "C'est bientôt la fin de journée, courage !";
      if (m >= 55 || m <= 5) return `Il est ${h} heures tapantes sur Radio B.A.T.`;
      if (h >= 22 || h < 6) return "Ambiance nocturne pour les couche-tard.";
      return "";
    }

    function announceUpcoming(titles, isNewTrack, onDone) {
      if (!titles || titles.length === 0) {
        if (onDone) onDone();
        return;
      }

      const cleanTitles = titles.map(t => t.replace(/\(.*\)/g, '').trim());
      const list = cleanTitles.join(", puis ");
      const timeNote = getTimeContext();

      const fallbackText = `Vous écoutez Radio B.A.T. ${timeNote} À suivre : ${list}.`;
      
      let contextPrompt = `Tu es un animateur radio nocturne, calme et posé. `;
      if (timeNote) contextPrompt += `Fais une très courte mention de ceci : "${timeNote}". `;
      if (isNewTrack) contextPrompt += `Annonce avec enthousiasme une nouveauté ou un artiste invité à l'antenne : ${titles[0]}. `;
      else contextPrompt += `En une phrase courte (15 mots max), annonce : ${list}. `;

      const speak = (textToSpeak) => {
        if (!('speechSynthesis' in window)) {
          if (onDone) onDone();
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSpeak);
        utter.lang = "fr-FR";
        utter.rate = 0.93;
        utter.onend = () => { if (onDone) onDone(); };
        utter.onerror = () => { if (onDone) onDone(); };
        window.speechSynthesis.speak(utter);
      };

      fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [{ role: "user", content: contextPrompt }],
          seed: Math.floor(Math.random() * 1000)
        })
      })
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.text();
        })
        .then((text) => {
          if (!text || text.includes("<!DOCTYPE") || text.length > 250) {
            speak(fallbackText);
          } else {
            speak(text.trim());
          }
        })
        .catch(() => speak(fallbackText));
    }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) s = 0;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, "0")}`;
    }

    function Radio() {
      const [tracks, setTracks] = useState([]);
      const [status, setStatus] = useState("idle");
      const [durations, setDurations] = useState(null);
      const [trackIndex, setTrackIndex] = useState(0);
      const [elapsedInTrack, setElapsedInTrack] = useState(0);
      const [coverUrl, setCoverUrl] = useState(null);
      const audioRef = useRef(null);

      const trackIndexRef = useRef(0);
      const tracksRef = useRef([]);
      const lastAnnouncementRef = useRef(Date.now());

      useEffect(() => { trackIndexRef.current = trackIndex; }, [trackIndex]);
      useEffect(() => { tracksRef.current = tracks; }, [tracks]);

      // Extraction binaire haute performance de la pochette ID3 APIC
      useEffect(() => {
        let createdUrl = null;

        if (tracks.length > 0 && tracks[trackIndex]) {
          fetch(tracks[trackIndex].url)
            .then(res => res.blob())
            .then(blob => {
              if (window.jsmediatags) {
                window.jsmediatags.read(blob, {
                  onSuccess: function(tag) {
                    const picture = tag.tags.picture;
                    if (picture) {
                      const byteArray = new Uint8Array(picture.data);
                      const imgBlob = new Blob([byteArray], { type: picture.format });
                      createdUrl = URL.createObjectURL(imgBlob);
                      setCoverUrl(createdUrl);
                    } else {
                      setCoverUrl(null);
                    }
                  },
                  onError: function() {
                    setCoverUrl(null);
                  }
                });
              }
            })
            .catch(() => setCoverUrl(null));
        }

        return () => {
          if (createdUrl) URL.revokeObjectURL(createdUrl);
        };
      }, [trackIndex, tracks]);

      // Scan des fichiers MP3 GitHub
      useEffect(() => {
        let cancelled = false;
        setStatus("loading");

        Promise.all([
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/").then(r => r.json()).catch(() => []),
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/nouveautes").then(r => r.json()).catch(() => [])
        ])
          .then(([rootFiles, newFiles]) => {
            let allTracks = [];

            if (Array.isArray(rootFiles)) {
              const rootMP3s = rootFiles
                .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".mp3"))
                .map(f => ({
                  title: decodeURIComponent(f.name.replace(/\.mp3$/i, "")),
                  url: f.download_url,
                  isNew: false
                }));
              allTracks.push(...rootMP3s);
            }

            if (Array.isArray(newFiles)) {
              const newMP3s = newFiles
                .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".mp3"))
                .map(f => ({
                  title: `[NOUVEAUTÉ] ${decodeURIComponent(f.name.replace(/\.mp3$/i, ""))}`,
                  url: f.download_url,
                  isNew: true
                }));
              allTracks.push(...newMP3s);
            }

            if (allTracks.length === 0) throw new Error("Aucun MP3 trouvé");

            const shuffled = seededShuffle(allTracks);
            setTracks(shuffled);

            return Promise.all(
              shuffled.map(
                (t) =>
                  new Promise((resolve) => {
                    const a = new Audio();
                    a.preload = "metadata";
                    a.src = t.url;
                    a.addEventListener("loadedmetadata", () => resolve(a.duration || 0));
                    a.addEventListener("error", () => resolve(0));
                  })
              )
            );
          })
          .then((durs) => {
            if (!cancelled && durs) {
              setDurations(durs);
              setStatus((s) => (s === "loading" ? "idle" : s));
            }
          })
          .catch(() => {
            if (!cancelled) setStatus("error");
          });

        return () => { cancelled = true; };
      }, []);

      const computePosition = useCallback(() => {
        if (!durations || durations.length === 0) return null;
        const total = durations.reduce((a, b) => a + b, 0);
        if (total <= 0) return null;

        const now = Date.now();
        let elapsed = ((now - EPOCH) / 1000) % total;
        if (elapsed < 0) elapsed += total;

        let idx = 0;
        for (let i = 0; i < durations.length; i++) {
          if (elapsed < durations[i]) {
            idx = i;
            break;
          }
          elapsed -= durations[i];
        }
        return { idx, offset: elapsed };
      }, [durations]);

      const tuneIn = useCallback(() => {
        const pos = computePosition();
        if (!pos || !audioRef.current || tracks.length === 0) return;

        setTrackIndex(pos.idx);
        const audio = audioRef.current;
        audio.src = tracks[pos.idx].url;
        audio.currentTime = pos.offset;

        audio
          .play()
          .then(() => setStatus("live"))
          .catch(() => setStatus("error"));
      }, [computePosition, tracks]);

      const handleEnded = () => { tuneIn(); };

      // API MediaSession (verrouillage mobile)
      useEffect(() => {
        if ('mediaSession' in navigator && tracks.length > 0 && tracks[trackIndex]) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: tracks[trackIndex].title,
            artist: STATION_NAME,
            album: "Direct Synchrone",
            artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/png' }] : []
          });

          navigator.mediaSession.setActionHandler('play', () => audioRef.current?.play());
          navigator.mediaSession.setActionHandler('pause', () => audioRef.current?.pause());
        }
      }, [trackIndex, tracks, coverUrl]);

      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === "visible" && status === "live") {
            tuneIn();
          }
        };
        document.addEventListener("visibilitychange", handleVisibilityChange);
        return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
      }, [status, tuneIn]);

      useEffect(() => {
        const t = setInterval(() => {
          const audio = audioRef.current;
          if (audio && !audio.paused) {
            setElapsedInTrack(audio.currentTime || 0);

            const remaining = (audio.duration || 0) - audio.currentTime;
            const now = Date.now();

            if (
              remaining > 0 &&
              remaining <= 12 &&
              now - lastAnnouncementRef.current >= ANNOUNCE_INTERVAL_MS &&
              tracksRef.current.length > 0
            ) {
              lastAnnouncementRef.current = now;
              const nextTrack = tracksRef.current[(trackIndexRef.current + 1) % tracksRef.current.length];
              const upcoming = [1, 2].map(
                (offset) => tracksRef.current[(trackIndexRef.current + offset) % tracksRef.current.length].title
              );

              audio.volume = 0.15;
              announceUpcoming(upcoming, nextTrack?.isNew, () => {
                if (audioRef.current) audioRef.current.volume = 1.0;
              });
            }
          }
        }, 400);
        return () => clearInterval(t);
      }, []);

      const currentDuration = durations ? durations[trackIndex] : 0;
      const progressPct = currentDuration
        ? Math.min(100, (elapsedInTrack / currentDuration) * 100)
        : 0;

      return (
        <div style={styles.wrap}>
          {coverUrl && (
            <div style={{
              position: "fixed",
              top: "-10%",
              left: "-10%",
              width: "120%",
              height: "120%",
              backgroundImage: `url(${coverUrl})`,
              backgroundSize: "cover",
              backgroundPosition: "center",
              filter: "blur(60px) brightness(0.35)",
              transform: "scale(1.2)",
              zIndex: 0,
              transition: "background-image 1.2s ease-in-out"
            }} />
          )}

          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');
            @keyframes eqbar { 0%, 100% { transform: scaleY(0.2); } 50% { transform: scaleY(1); } }
            @keyframes ledpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
            .rb-bar { animation: eqbar 0.8s ease-in-out infinite; transform-origin: bottom; }
            .rb-led-live { animation: ledpulse 1.8s ease-in-out infinite; }
          `}</style>

          <div style={styles.panel}>
            <div style={styles.headerRow}>
              <div
                className={status === "live" ? "rb-led-live" : ""}
                style={{
                  ...styles.led,
                  background: status === "live" ? "#ff5a3c" : "#3a2a22",
                  boxShadow: status === "live" ? "0 0 10px #ff5a3c" : "none",
                }}
              />
              <span style={styles.headerLabel}>
                {status === "live"
                  ? "ON AIR"
                  : status === "loading"
                  ? "CHARGEMENT DU FLUX…"
                  : status === "error"
                  ? "ERREUR DE FLUX"
                  : "STANDBY"}
              </span>
            </div>

            <h1 style={styles.station}>{STATION_NAME}</h1>
            <div style={styles.subtext}>Direct Synchrone</div>

            <div style={styles.coverBox}>
              {coverUrl ? (
                <img src={coverUrl} alt="Pochette d'album" style={styles.coverImg} />
              ) : (
                <div style={styles.fallbackCover}>
                  <div style={styles.fallbackTitle}>RADIO B.A.T</div>
                  <div style={styles.fallbackSubtitle}>DIRECT</div>
                </div>
              )}
            </div>

            <div style={styles.display}>
              <div style={styles.trackLabel}>
                {tracks.length > 0 ? tracks[trackIndex]?.title : "Détection des morceaux..."}
              </div>
              <div style={styles.timeRow}>
                <span>{formatTime(elapsedInTrack)}</span>
                <span>{formatTime(currentDuration)}</span>
              </div>
              <div style={styles.progressTrack}>
                <div style={{ ...styles.progressFill, width: `${progressPct}%` }} />
              </div>
            </div>

            <div style={styles.bars}>
              {Array.from({ length: 14 }).map((_, i) => (
                <div
                  key={i}
                  className={status === "live" ? "rb-bar" : ""}
                  style={{
                    ...styles.bar,
                    animationDelay: `${(i % 5) * 0.12}s`,
                    transform: status === "live" ? undefined : "scaleY(0.15)",
                  }}
                />
              ))}
            </div>

            {status !== "live" && (
              <button style={styles.tuneButton} onClick={tuneIn} disabled={!durations}>
                {durations ? "Se brancher sur l'antenne" : "Chargement des fréquences…"}
              </button>
            )}

            {status === "live" && <div style={styles.liveNote}>Flux en direct</div>}
            {status === "error" && <div style={styles.liveNote}>Erreur au chargement des fichiers.</div>}

            <audio ref={audioRef} onEnded={handleEnded} />
          </div>
        </div>
      );
    }

    const styles = {
      wrap: { position: "relative", minHeight: "100vh", width: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "#050302", padding: "20px", boxSizing: "border-box" },
      panel: { position: "relative", zIndex: 1, width: "100%", maxWidth: "360px", background: "rgba(20, 15, 25, 0.75)", backdropFilter: "blur(20px)", border: "1px solid rgba(255, 255, 255, 0.12)", borderRadius: "22px", padding: "22px 20px 24px", boxShadow: "0 25px 50px rgba(0,0,0,0.6)", fontFamily: "'Space Mono', monospace", color: "#f0dcb8" },
      headerRow: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "4px" },
      led: { width: "9px", height: "9px", borderRadius: "50%", flexShrink: 0, transition: "all 0.3s ease" },
      headerLabel: { fontSize: "11px", letterSpacing: "2px", color: "#c9a877" },
      station: { fontFamily: "'Bebas Neue', sans-serif", fontSize: "40px", letterSpacing: "3px", color: "#ffffff", margin: "2px 0 0", lineHeight: 1 },
      subtext: { fontSize: "11px", color: "#a48760", marginTop: "2px", marginBottom: "18px", letterSpacing: "1px" },
      coverBox: { width: "100%", aspectRatio: "1 / 1", borderRadius: "14px", overflow: "hidden", marginBottom: "18px", background: "#0a0710", display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid rgba(255, 255, 255, 0.1)", boxShadow: "0 12px 30px rgba(0,0,0,0.5)" },
      coverImg: { width: "100%", height: "100%", objectFit: "cover" },
      fallbackCover: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: "100%", height: "100%", background: "radial-gradient(circle, #1a102f 0%, #08040d 100%)" },
      fallbackTitle: { fontFamily: "'Bebas Neue', sans-serif", fontSize: "32px", color: "#ffbb33", letterSpacing: "2px" },
      fallbackSubtitle: { fontSize: "10px", color: "#8a6d47", letterSpacing: "2px" },
      display: { background: "rgba(10, 8, 14, 0.6)", border: "1px solid rgba(255, 255, 255, 0.08)", borderRadius: "12px", padding: "14px", marginBottom: "16px" },
      trackLabel: { fontSize: "13px", color: "#ffffff", fontWeight: "bold", minHeight: "36px", lineHeight: 1.3, marginBottom: "8px" },
      timeRow: { display: "flex", justifyContent: "space-between", fontSize: "11px", color: "#a48760", marginBottom: "6px" },
      progressTrack: { height: "4px", borderRadius: "2px", background: "rgba(255,255,255,0.1)", overflow: "hidden" },
      progressFill: { height: "100%", background: "linear-gradient(90deg, #ffbb33, #ff5a3c)", transition: "width 0.4s linear" },
      bars: { display: "flex", alignItems: "flex-end", gap: "4px", height: "32px", marginBottom: "18px", justifyContent: "center" },
      bar: { width: "5px", height: "100%", borderRadius: "2px", background: "linear-gradient(180deg, #ffbb33, #ff5a3c)" },
      tuneButton: { width: "100%", padding: "13px", borderRadius: "12px", border: "none", background: "linear-gradient(160deg, #f2b544, #d9862a)", color: "#241608", fontFamily: "'Space Mono', monospace", fontWeight: "bold", fontSize: "13px", letterSpacing: "0.5px", cursor: "pointer" },
      liveNote: { textAlign: "center", fontSize: "10.5px", color: "#a48760", letterSpacing: "0.5px" }
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Radio />);
  </script>
</body>
</html>
