<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO B.A.T — Direct</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0; background:#0b0d12; color:#ffffff; font-family:'Plus Jakarta Sans', sans-serif; overflow-x:hidden;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const ARTIST_NAME = "DJ B.A.T";
    const STATION_NAME = "RADIO B.A.T";
    const EPOCH = new Date("2026-01-01T00:00:00Z").getTime();

    const DEFAULT_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'><rect width='100%' height='100%' fill='%23121824'/><circle cx='300' cy='300' r='200' fill='none' stroke='%2355d6be' stroke-width='4' opacity='0.25'/><circle cx='300' cy='300' r='140' fill='none' stroke='%2355d6be' stroke-width='2' opacity='0.15'/><text x='50%' y='46%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-size='42' font-weight='800' letter-spacing='4'>RADIO B.A.T</text><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' fill='%2355d6be' font-family='sans-serif' font-size='18' font-weight='700' letter-spacing='6'>DIRECT SYNCHRONE</text></svg>";

    // Extracteur ID3 ultra-précis (découpe stricte des bordures d'image)
    async function extractCoverFromMP3(url) {
      try {
        const response = await fetch(url);
        if (!response.ok || !response.body) return null;

        const reader = response.body.getReader();
        const chunks = [];
        let totalBytes = 0;
        let requiredBytes = 4 * 1024 * 1024; // 4 Mo max pour les grosses pochette HD
        let tagSizeCalculated = false;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          totalBytes += value.length;

          if (!tagSizeCalculated && totalBytes >= 10) {
            const firstBytes = new Uint8Array(10);
            let copied = 0;
            for (const chunk of chunks) {
              const toCopy = Math.min(chunk.length, 10 - copied);
              firstBytes.set(chunk.subarray(0, toCopy), copied);
              copied += toCopy;
              if (copied >= 10) break;
            }

            // Vérification signature ID3v2
            if (firstBytes[0] === 0x49 && firstBytes[1] === 0x44 && firstBytes[2] === 0x33) {
              const tagSize = ((firstBytes[6] & 0x7f) << 21) |
                              ((firstBytes[7] & 0x7f) << 14) |
                              ((firstBytes[8] & 0x7f) << 7) |
                               (firstBytes[9] & 0x7f);
              requiredBytes = tagSize + 10;
            } else {
              reader.cancel();
              return null;
            }
            tagSizeCalculated = true;
          }

          if (totalBytes >= requiredBytes) {
            reader.cancel();
            break;
          }
        }

        const buffer = new Uint8Array(Math.min(totalBytes, requiredBytes));
        let offset = 0;
        for (const chunk of chunks) {
          if (offset >= buffer.length) break;
          const writeLen = Math.min(chunk.length, buffer.length - offset);
          buffer.set(chunk.subarray(0, writeLen), offset);
          offset += writeLen;
        }

        const tagEnd = buffer.length;

        // 1. Recherche JPEG (Début: FF D8 FF -> Fin exacte: FF D9)
        for (let i = 10; i < tagEnd - 4; i++) {
          if (buffer[i] === 0xFF && buffer[i + 1] === 0xD8 && buffer[i + 2] === 0xFF) {
            let imgEnd = -1;
            for (let j = i + 100; j < tagEnd - 1; j++) {
              if (buffer[j] === 0xFF && buffer[j + 1] === 0xD9) {
                imgEnd = j + 2; // Inclut le marqueur de fin EOI
              }
            }
            if (imgEnd !== -1) {
              const imgData = buffer.subarray(i, imgEnd);
              return URL.createObjectURL(new Blob([imgData], { type: "image/jpeg" }));
            }
          }

          // 2. Recherche PNG (Début: 89 50 4E 47 -> Fin exacte du bloc IEND)
          if (buffer[i] === 0x89 && buffer[i + 1] === 0x50 && buffer[i + 2] === 0x4E && buffer[i + 3] === 0x47) {
            let imgEnd = -1;
            for (let j = i + 8; j < tagEnd - 8; j++) {
              if (buffer[j] === 0x49 && buffer[j + 1] === 0x45 && buffer[j + 2] === 0x4E && buffer[j + 3] === 0x47) {
                imgEnd = j + 8; // IEND + 4 octets de CRC
                break;
              }
            }
            if (imgEnd !== -1) {
              const imgData = buffer.subarray(i, imgEnd);
              return URL.createObjectURL(new Blob([imgData], { type: "image/png" }));
            }
          }
        }
      } catch (e) {
        console.error("Erreur extraction ID3 :", e);
      }
      return null;
    }

    function seededShuffle(array, seed = 42) {
      let m = array.length, t, i;
      let s = seed;
      const random = () => {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let imul = Math.imul(s ^ s >>> 15, 1 | s);
        imul = imul + Math.imul(imul ^ imul >>> 7, 61 | imul) ^ imul;
        return ((imul ^ imul >>> 14) >>> 0) / 4294967296;
      };
      const shuffled = [...array];
      while (m) {
        i = Math.floor(random() * m--);
        t = shuffled[m];
        shuffled[m] = shuffled[i];
        shuffled[i] = t;
      }
      return shuffled;
    }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) return "00:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m.toString().padStart(2, "0")}:${sec.toString().padStart(2, "0")}`;
    }

    function Radio() {
      const [tracks, setTracks] = useState([]);
      const [status, setStatus] = useState("idle");
      const [durations, setDurations] = useState(null);
      const [trackIndex, setTrackIndex] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentCover, setCurrentCover] = useState(DEFAULT_COVER);
      const audioRef = useRef(null);

      useEffect(() => {
        let cancelled = false;
        setStatus("loading");

        Promise.all([
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/").then(r => r.json()).catch(() => []),
          fetch("https://api.github.com/repos/Roxasnake/Radio/contents/nouveautes").then(r => r.json()).catch(() => [])
        ])
          .then(([rootFiles, newFiles]) => {
            let allMP3s = [];

            const parseFiles = (files) => {
              if (!Array.isArray(files)) return [];
              return files
                .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".mp3"))
                .map(f => ({
                  title: decodeURIComponent(f.name.replace(/\.mp3$/i, "")),
                  url: f.download_url
                }));
            };

            allMP3s = [...parseFiles(rootFiles), ...parseFiles(newFiles)];
            if (allMP3s.length === 0) throw new Error("Aucun morceau MP3 trouvé");

            const shuffled = seededShuffle(allMP3s);
            setTracks(shuffled);

            return Promise.all(
              shuffled.map(
                (t) =>
                  new Promise((resolve) => {
                    const a = new Audio();
                    a.preload = "metadata";
                    a.src = t.url;
                    a.addEventListener("loadedmetadata", () => resolve(a.duration || 0));
                    a.addEventListener("error", () => resolve(0));
                  })
              )
            );
          })
          .then((durs) => {
            if (!cancelled && durs) {
              setDurations(durs);
              setStatus("idle");
            }
          })
          .catch(() => {
            if (!cancelled) setStatus("error");
          });

        return () => { cancelled = true; };
      }, []);

      const computePosition = useCallback(() => {
        if (!durations || durations.length === 0) return null;
        const total = durations.reduce((a, b) => a + b, 0);
        if (total <= 0) return null;

        const now = Date.now();
        let currentElapsed = ((now - EPOCH) / 1000) % total;
        if (currentElapsed < 0) currentElapsed += total;

        let idx = 0;
        for (let i = 0; i < durations.length; i++) {
          if (currentElapsed < durations[i]) {
            idx = i;
            break;
          }
          currentElapsed -= durations[i];
        }
        return { idx, offset: currentElapsed };
      }, [durations]);

      const tuneIn = useCallback(() => {
        const pos = computePosition();
        if (!pos || !audioRef.current || tracks.length === 0) return;

        setTrackIndex(pos.idx);
        const audio = audioRef.current;
        audio.src = tracks[pos.idx].url;
        audio.currentTime = pos.offset;

        audio
          .play()
          .then(() => {
            setStatus("live");
            setIsPlaying(true);
          })
          .catch(() => setStatus("error"));
      }, [computePosition, tracks]);

      useEffect(() => {
        let active = true;
        if (tracks.length > 0 && tracks[trackIndex]) {
          const track = tracks[trackIndex];

          (async () => {
            const extractedImg = await extractCoverFromMP3(track.url);
            if (active) {
              setCurrentCover(extractedImg || DEFAULT_COVER);
            }
          })();
        }
        return () => { active = false; };
      }, [trackIndex, tracks]);

      const togglePlay = () => {
        const audio = audioRef.current;
        if (!audio) return;

        if (isPlaying) {
          audio.pause();
          setIsPlaying(false);
        } else {
          if (status !== "live") {
            tuneIn();
          } else {
            audio.play();
            setIsPlaying(true);
          }
        }
      };

      const handleEnded = () => {
        tuneIn();
      };

      useEffect(() => {
        if ('mediaSession' in navigator && tracks.length > 0 && tracks[trackIndex]) {
          const currentTrack = tracks[trackIndex];

          navigator.mediaSession.metadata = new MediaMetadata({
            title: currentTrack.title,
            artist: ARTIST_NAME,
            album: STATION_NAME,
            artwork: [{ src: currentCover, sizes: '512x512', type: 'image/png' }]
          });

          navigator.mediaSession.setActionHandler('play', () => {
            audioRef.current?.play();
            setIsPlaying(true);
          });
          navigator.mediaSession.setActionHandler('pause', () => {
            audioRef.current?.pause();
            setIsPlaying(false);
          });
        }
      }, [trackIndex, tracks, currentCover]);

      useEffect(() => {
        const t = setInterval(() => {
          if (audioRef.current && !audioRef.current.paused) {
            setElapsed(audioRef.current.currentTime || 0);
          }
        }, 300);
        return () => clearInterval(t);
      }, []);

      const currentTrack = tracks[trackIndex] || { title: "Connexion au flux..." };
      const currentDuration = durations ? durations[trackIndex] : 0;
      const progressPct = currentDuration ? Math.min(100, (elapsed / currentDuration) * 100) : 0;

      return (
        <div style={styles.appContainer}>
          <div 
            style={{
              ...styles.bgBlur,
              backgroundImage: `url(${currentCover})`
            }} 
          />

          <div style={styles.playerCard}>
            <div style={styles.topBar}>
              <span style={styles.stationBadge}>● DIRECT SYNCHRONE</span>
            </div>

            <div style={styles.coverWrapper}>
              <img 
                src={currentCover} 
                alt="Pochette" 
                style={styles.coverImage}
                onError={(e) => { e.target.src = DEFAULT_COVER; }}
              />
            </div>

            <div style={styles.trackInfo}>
              <h2 style={styles.trackTitle}>{currentTrack.title}</h2>
              <p style={styles.artistTitle}>{ARTIST_NAME}</p>
            </div>

            <div style={styles.controlsWidget}>
              <div style={styles.outputRow}>
                <div style={styles.outputDevice}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                  <span>Sortie média</span>
                </div>
              </div>

              <div style={styles.progressContainer}>
                <div style={styles.progressBarBg}>
                  <div style={{ ...styles.progressBarFill, width: `${progressPct}%` }} />
                  <div style={{ ...styles.progressKnob, left: `calc(${progressPct}% - 6px)` }} />
                </div>
                <div style={styles.timeRow}>
                  <span>{formatTime(elapsed)}</span>
                  <span>{formatTime(currentDuration)}</span>
                </div>
              </div>

              <div style={styles.buttonsRow}>
                <button style={styles.playBtn} onClick={isPlaying ? togglePlay : tuneIn}>
                  {isPlaying ? (
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                  ) : (
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style={{ marginLeft: '4px' }}><path d="M8 5v14l11-7z"/></svg>
                  )}
                </button>
              </div>
            </div>
          </div>

          <audio ref={audioRef} onEnded={handleEnded} />
        </div>
      );
    }

    const styles = {
      appContainer: {
        position: 'relative',
        minHeight: '100vh',
        width: '100vw',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        padding: '20px',
        boxSizing: 'border-box',
        overflow: 'hidden'
      },
      bgBlur: {
        position: 'absolute',
        top: '-10%',
        left: '-10%',
        width: '120%',
        height: '120%',
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        filter: 'blur(55px) brightness(0.35)',
        transform: 'scale(1.1)',
        zIndex: 0,
        transition: 'background-image 0.8s ease-in-out'
      },
      playerCard: {
        position: 'relative',
        zIndex: 1,
        width: '100%',
        maxWidth: '380px',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center'
      },
      topBar: {
        marginBottom: '16px'
      },
      stationBadge: {
        fontSize: '11px',
        fontWeight: '700',
        letterSpacing: '1.5px',
        color: '#55d6be',
        background: 'rgba(85, 214, 190, 0.15)',
        padding: '6px 14px',
        borderRadius: '20px',
        border: '1px solid rgba(85, 214, 190, 0.3)'
      },
      coverWrapper: {
        width: '100%',
        aspectRatio: '1 / 1',
        borderRadius: '28px',
        overflow: 'hidden',
        boxShadow: '0 20px 40px rgba(0,0,0,0.6)',
        marginBottom: '20px'
      },
      coverImage: {
        width: '100%',
        height: '100%',
        objectFit: 'cover'
      },
      trackInfo: {
        textAlign: 'center',
        marginBottom: '22px',
        width: '100%'
      },
      trackTitle: {
        fontSize: '22px',
        fontWeight: '800',
        margin: '0 0 6px 0',
        color: '#ffffff',
        letterSpacing: '-0.3px',
        whiteSpace: 'nowrap',
        overflow: 'hidden',
        textOverflow: 'ellipsis'
      },
      artistTitle: {
        fontSize: '14px',
        fontWeight: '600',
        margin: 0,
        color: 'rgba(255, 255, 255, 0.65)'
      },
      controlsWidget: {
        width: '100%',
        background: 'rgba(30, 42, 50, 0.65)',
        backdropFilter: 'blur(25px)',
        WebkitBackdropFilter: 'blur(25px)',
        borderRadius: '24px',
        padding: '18px',
        boxSizing: 'border-box',
        border: '1px solid rgba(255, 255, 255, 0.12)',
        boxShadow: '0 10px 30px rgba(0,0,0,0.3)'
      },
      outputRow: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginBottom: '14px'
      },
      outputDevice: {
        display: 'flex',
        alignItems: 'center',
        gap: '6px',
        fontSize: '12px',
        color: 'rgba(255, 255, 255, 0.7)',
        fontWeight: '600'
      },
      progressContainer: {
        width: '100%',
        marginBottom: '16px'
      },
      progressBarBg: {
        position: 'relative',
        width: '100%',
        height: '4px',
        background: 'rgba(255, 255, 255, 0.2)',
        borderRadius: '2px',
        marginBottom: '8px'
      },
      progressBarFill: {
        height: '100%',
        background: '#55d6be',
        borderRadius: '2px',
        transition: 'width 0.3s linear'
      },
      progressKnob: {
        position: 'absolute',
        top: '-4px',
        width: '12px',
        height: '12px',
        borderRadius: '50%',
        background: '#55d6be',
        boxShadow: '0 0 8px #55d6be'
      },
      timeRow: {
        display: 'flex',
        justifyContent: 'space-between',
        fontSize: '11px',
        color: 'rgba(255, 255, 255, 0.5)',
        fontWeight: '600'
      },
      buttonsRow: {
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center'
      },
      playBtn: {
        width: '56px',
        height: '56px',
        borderRadius: '50%',
        background: '#ffffff',
        color: '#0b0d12',
        border: 'none',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        cursor: 'pointer',
        boxShadow: '0 4px 15px rgba(255,255,255,0.25)'
      }
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Radio />);
  </script>
</body>
</html>
